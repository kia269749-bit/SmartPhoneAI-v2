name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create project files
        run: |
          mkdir -p app/src/main/java/com/example/smartphoneai
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "SmartPhoneAI"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.smartphoneai"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.example.smartphoneai"
                  minSdk = 30
                  targetSdk = 34
                  versionCode = 3
                  versionName = "2.1"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

          cat > app/src/main/res/drawable/ic_bg.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#1E88E5"
                  android:pathData="M0,0h108v108h-108z" />
          </vector>
          EOF

          cat > app/src/main/res/drawable/ic_fg.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <group
                  android:scaleX="2.2"
                  android:scaleY="2.2"
                  android:translateX="27.6"
                  android:translateY="27.6">
                  <path
                      android:fillColor="#FFFFFF"
                      android:pathData="M19.35,10.04C18.67,6.59 15.64,4 12,4 9.11,4 6.6,5.64 5.35,8.04 2.34,8.36 0,10.91 0,14c0,3.31 2.69,6 6,6h13c2.76,0 5,-2.24 5,-5 0,-2.64 -2.05,-4.78 -4.65,-4.96zM14,13v4h-4v-4H7l5,-5 5,5h-3z" />
              </group>
          </vector>
          EOF

          cat > app/src/main/res/mipmap-anydpi/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_bg" />
              <foreground android:drawable="@drawable/ic_fg" />
          </adaptive-icon>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-permission
                  android:name="android.permission.READ_EXTERNAL_STORAGE"
                  android:maxSdkVersion="32" />
              <application
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:label="SmartPhone AI"
                  android:theme="@android:style/Theme.Material.Light">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/example/smartphoneai/MainActivity.kt <<'EOF'
          package com.example.smartphoneai

          import android.Manifest
          import android.app.Activity
          import android.app.AlertDialog
          import android.content.ContentUris
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.MediaStore
          import android.view.Gravity
          import android.view.View
          import android.widget.Button
          import android.widget.CheckBox
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast
          import java.security.MessageDigest

          class MainActivity : Activity() {

              private val pickCode = 1
              private val deleteCode = 2
              private val dupDeleteCode = 3
              private val permCode = 10
              private val batch = 100
              private val drivePackage = "com.google.android.apps.docs"
              private val imagesUri: Uri = MediaStore.Images.Media.EXTERNAL_CONTENT_URI

              private var selected: List<Uri> = emptyList()
              private var dupes: List<Uri> = emptyList()
              private var pendingAction = 0
              private var sentPending = false

              private lateinit var status: TextView
              private lateinit var sendBtn: Button
              private lateinit var check: CheckBox
              private lateinit var deleteBtn: Button
              private lateinit var scanBtn: Button
              private lateinit var dupDeleteBtn: Button

              private class Img(val id: Long, val date: Long)

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val pad = (16 * resources.displayMetrics.density).toInt()
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(pad, pad, pad, pad)
                      layoutDirection = View.LAYOUT_DIRECTION_RTL
                  }

                  status = TextView(this).apply {
                      textSize = 18f
                      gravity = Gravity.START
                      text = "هنوز عکسی انتخاب نشده."
                  }
                  root.addView(status)

                  makeButton(root, "۱) انتخاب دستی عکس‌ها", true) { pickPhotos() }
                  makeButton(root, "۱ب) انتخاب یک پوشه (تا ۱۰۰ عکس)", true) { withPermission(1) }

                  sendBtn = makeButton(root, "۲) ارسال به Google Drive", false) { sendToDrive() }

                  check = CheckBox(this).apply {
                      text = "داخل Drive نگاه کردم و همه‌ی عکس‌ها آپلود شده‌اند"
                      isEnabled = false
                      setOnCheckedChangeListener { _, checked -> deleteBtn.isEnabled = checked }
                  }
                  root.addView(check)

                  deleteBtn = makeButton(root, "۳) حذف این عکس‌ها از گوشی", false) { deleteFromPhone() }

                  val title = TextView(this).apply {
                      textSize = 16f
                      setPadding(0, pad, 0, 0)
                      text = "عکس‌های تکراری:"
                  }
                  root.addView(title)

                  scanBtn = makeButton(root, "پیدا کردن عکس‌های تکراری", true) { withPermission(2) }
                  dupDeleteBtn = makeButton(root, "حذف تکراری‌ها (یک نسخه از هر عکس می‌ماند)", false) { deleteDupes() }

                  val scroll = ScrollView(this)
                  scroll.addView(root)
                  setContentView(scroll)
              }

              override fun onResume() {
                  super.onResume()
                  if (sentPending) {
                      sentPending = false
                      AlertDialog.Builder(this)
                          .setTitle("ارسال انجام شد")
                          .setMessage("عکس‌ها به Google Drive سپرده شدند. آپلود در پس‌زمینه انجام می‌شود و ممکن است چند دقیقه طول بکشد.\n\nوقتی تمام شد، برنامه‌ی Drive را باز کنید و بررسی کنید همه‌ی عکس‌ها آنجا هستند. بعد به اینجا برگردید، تیک را بزنید و حذف کنید.")
                          .setPositiveButton("باشه", null)
                          .show()
                  }
              }

              private fun makeButton(root: LinearLayout, label: String, enabled: Boolean, onClick: () -> Unit): Button {
                  val b = Button(this)
                  b.text = label
                  b.isEnabled = enabled
                  b.setOnClickListener { onClick() }
                  root.addView(b)
                  return b
              }

              private fun permName(): String {
                  return if (Build.VERSION.SDK_INT >= 33) Manifest.permission.READ_MEDIA_IMAGES
                  else Manifest.permission.READ_EXTERNAL_STORAGE
              }

              private fun withPermission(action: Int) {
                  if (checkSelfPermission(permName()) == PackageManager.PERMISSION_GRANTED) {
                      runAction(action)
                  } else {
                      pendingAction = action
                      requestPermissions(arrayOf(permName()), permCode)
                  }
              }

              private fun runAction(a: Int) {
                  if (a == 1) showFolders()
                  if (a == 2) findDuplicates()
              }

              override fun onRequestPermissionsResult(requestCode: Int, permissions: Array<String>, grantResults: IntArray) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  if (requestCode == permCode) {
                      if (grantResults.isNotEmpty() && grantResults[0] == PackageManager.PERMISSION_GRANTED) {
                          runAction(pendingAction)
                      } else {
                          Toast.makeText(this, "بدون اجازه‌ی دسترسی به عکس‌ها این بخش کار نمی‌کند.", Toast.LENGTH_LONG).show()
                      }
                  }
              }

              private fun toMediaUri(u: Uri): Uri {
                  if (u.authority == "media") return u
                  return try {
                      MediaStore.getMediaUri(this, u) ?: u
                  } catch (e: Exception) {
                      u
                  }
              }

              private fun resetAfterSelect(count: Int, text: String) {
                  status.text = text
                  sendBtn.isEnabled = count > 0
                  check.isChecked = false
                  check.isEnabled = false
                  deleteBtn.isEnabled = false
              }

              private fun pickPhotos() {
                  val i = Intent(Intent.ACTION_OPEN_DOCUMENT).apply {
                      addCategory(Intent.CATEGORY_OPENABLE)
                      type = "image/*"
                      putExtra(Intent.EXTRA_ALLOW_MULTIPLE, true)
                  }
                  startActivityForResult(i, pickCode)
              }

              private fun showFolders() {
                  val map = LinkedHashMap<String, MutableList<Long>>()
                  val proj = arrayOf(
                      MediaStore.Images.Media._ID,
                      MediaStore.Images.Media.BUCKET_DISPLAY_NAME
                  )
                  contentResolver.query(imagesUri, proj, null, null, MediaStore.Images.Media.DATE_ADDED + " DESC")?.use { c ->
                      val idCol = c.getColumnIndexOrThrow(MediaStore.Images.Media._ID)
                      val bCol = c.getColumnIndexOrThrow(MediaStore.Images.Media.BUCKET_DISPLAY_NAME)
                      while (c.moveToNext()) {
                          val name = c.getString(bCol) ?: "نامشخص"
                          map.getOrPut(name) { mutableListOf() }.add(c.getLong(idCol))
                      }
                  }
                  if (map.isEmpty()) {
                      Toast.makeText(this, "عکسی پیدا نشد.", Toast.LENGTH_LONG).show()
                      return
                  }
                  val names = map.keys.toList()
                  val labels = names.map { it + " (" + map[it]!!.size + ")" }.toTypedArray()
                  AlertDialog.Builder(this)
                      .setTitle("یک پوشه انتخاب کنید")
                      .setItems(labels) { _, which ->
                          val name = names[which]
                          val ids = map[name]!!.take(batch)
                          selected = ids.map { ContentUris.withAppendedId(imagesUri, it) }
                          resetAfterSelect(selected.size, selected.size.toString() + " عکس از پوشه‌ی " + name + " انتخاب شد (حداکثر " + batch + " در هر بار).")
                      }
                      .show()
              }

              private fun sendToDrive() {
                  val i = Intent(Intent.ACTION_SEND_MULTIPLE).apply {
                      type = "image/*"
                      putParcelableArrayListExtra(Intent.EXTRA_STREAM, ArrayList(selected))
                      addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                  }
                  try {
                      i.setPackage(drivePackage)
                      startActivity(i)
                  } catch (e: Exception) {
                      i.setPackage(null)
                      startActivity(Intent.createChooser(i, "ارسال به Drive"))
                  }
                  sentPending = true
                  check.isEnabled = true
              }

              private fun deleteFromPhone() {
                  try {
                      val mediaUris = selected.map { toMediaUri(it) }
                      val req = MediaStore.createDeleteRequest(contentResolver, mediaUris)
                      startIntentSenderForResult(req.intentSender, deleteCode, null, 0, 0, 0)
                  } catch (e: Exception) {
                      Toast.makeText(this, "خطا در حذف: " + e.message, Toast.LENGTH_LONG).show()
                  }
              }

              private fun sha256(uri: Uri): String? {
                  return try {
                      contentResolver.openInputStream(uri)?.use { s ->
                          val md = MessageDigest.getInstance("SHA-256")
                          val buf = ByteArray(65536)
                          while (true) {
                              val n = s.read(buf)
                              if (n < 0) break
                              md.update(buf, 0, n)
                          }
                          md.digest().joinToString("") { "%02x".format(it) }
                      }
                  } catch (e: Exception) {
                      null
                  }
              }

              private fun findDuplicates() {
                  scanBtn.isEnabled = false
                  dupDeleteBtn.isEnabled = false
                  status.text = "در حال بررسی عکس‌ها..."
                  Thread {
                      val bySize = HashMap<Long, MutableList<Img>>()
                      val proj = arrayOf(
                          MediaStore.Images.Media._ID,
                          MediaStore.Images.Media.SIZE,
                          MediaStore.Images.Media.DATE_ADDED
                      )
                      contentResolver.query(imagesUri, proj, null, null, null)?.use { c ->
                          val i0 = c.getColumnIndexOrThrow(MediaStore.Images.Media._ID)
                          val i1 = c.getColumnIndexOrThrow(MediaStore.Images.Media.SIZE)
                          val i2 = c.getColumnIndexOrThrow(MediaStore.Images.Media.DATE_ADDED)
                          while (c.moveToNext()) {
                              val size = c.getLong(i1)
                              if (size > 0) {
                                  bySize.getOrPut(size) { mutableListOf() }.add(Img(c.getLong(i0), c.getLong(i2)))
                              }
                          }
                      }
                      val candidates = bySize.filter { it.value.size > 1 }
                      var total = 0
                      for (e in candidates) total += e.value.size
                      var done = 0
                      val toDelete = mutableListOf<Long>()
                      var savedBytes = 0L
                      for ((size, list) in candidates) {
                          val byHash = HashMap<String, MutableList<Img>>()
                          for (img in list) {
                              val h = sha256(ContentUris.withAppendedId(imagesUri, img.id))
                              if (h != null) byHash.getOrPut(h) { mutableListOf() }.add(img)
                              done++
                              if (done % 20 == 0) {
                                  val d = done
                                  runOnUiThread { status.text = "بررسی " + d + " از " + total + " ..." }
                              }
                          }
                          for (g in byHash.values) {
                              if (g.size > 1) {
                                  g.sortBy { it.date }
                                  for (k in 1 until g.size) {
                                      toDelete.add(g[k].id)
                                      savedBytes += size
                                  }
                              }
                          }
                      }
                      val uris = toDelete.map { ContentUris.withAppendedId(imagesUri, it) }
                      val mb = savedBytes / 1048576
                      runOnUiThread {
                          dupes = uris
                          scanBtn.isEnabled = true
                          if (uris.isEmpty()) {
                              status.text = "عکس تکراری پیدا نشد."
                          } else {
                              status.text = uris.size.toString() + " عکس تکراری پیدا شد (حدود " + mb + " مگابایت). از هر گروه یک نسخه می‌ماند."
                              dupDeleteBtn.isEnabled = true
                          }
                      }
                  }.start()
              }

              private fun deleteDupes() {
                  try {
                      val req = MediaStore.createDeleteRequest(contentResolver, dupes.take(500))
                      startIntentSenderForResult(req.intentSender, dupDeleteCode, null, 0, 0, 0)
                  } catch (e: Exception) {
                      Toast.makeText(this, "خطا در حذف: " + e.message, Toast.LENGTH_LONG).show()
                  }
              }

              @Deprecated("Deprecated in Java")
              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == pickCode && resultCode == RESULT_OK && data != null) {
                      val list = mutableListOf<Uri>()
                      val clip = data.clipData
                      if (clip != null) {
                          for (n in 0 until clip.itemCount) list.add(clip.getItemAt(n).uri)
                      } else {
                          data.data?.let { list.add(it) }
                      }
                      selected = list
                      resetAfterSelect(list.size, list.size.toString() + " عکس انتخاب شد.")
                  }
                  if (requestCode == deleteCode) {
                      if (resultCode == RESULT_OK) {
                          selected = emptyList()
                          resetAfterSelect(0, "عکس‌ها از گوشی حذف شدند.")
                      } else {
                          status.text = "حذف لغو شد. چیزی پاک نشد."
                      }
                  }
                  if (requestCode == dupDeleteCode) {
                      if (resultCode == RESULT_OK) {
                          dupes = emptyList()
                          dupDeleteBtn.isEnabled = false
                          status.text = "تکراری‌ها حذف شدند."
                      } else {
                          status.text = "حذف لغو شد. چیزی پاک نشد."
                      }
                  }
              }
          }
          EOF

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
