name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create project files
        run: |
          mkdir -p app/src/main/java/com/example/smartphoneai

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "SmartPhoneAI"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.smartphoneai"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.example.smartphoneai"
                  minSdk = 30
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="SmartPhone AI"
                  android:theme="@android:style/Theme.Material.Light">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/example/smartphoneai/MainActivity.kt <<'EOF'
          package com.example.smartphoneai

          import android.app.Activity
          import android.content.Intent
          import android.net.Uri
          import android.provider.MediaStore
          import android.os.Bundle
          import android.view.Gravity
          import android.view.View
          import android.widget.Button
          import android.widget.CheckBox
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast

          class MainActivity : Activity() {

              private val pickCode = 1
              private val deleteCode = 2
              private val drivePackage = "com.google.android.apps.docs"

              private var selected: List<Uri> = emptyList()

              private lateinit var status: TextView
              private lateinit var sendBtn: Button
              private lateinit var check: CheckBox
              private lateinit var deleteBtn: Button

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val pad = (16 * resources.displayMetrics.density).toInt()
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(pad, pad, pad, pad)
                      layoutDirection = View.LAYOUT_DIRECTION_RTL
                  }

                  status = TextView(this).apply {
                      textSize = 18f
                      gravity = Gravity.START
                      text = "هنوز عکسی انتخاب نشده."
                  }
                  root.addView(status)

                  val pickBtn = Button(this).apply {
                      text = "۱) انتخاب عکس‌ها"
                      setOnClickListener { pickPhotos() }
                  }
                  root.addView(pickBtn)

                  sendBtn = Button(this).apply {
                      text = "۲) ارسال به Google Drive"
                      isEnabled = false
                      setOnClickListener { sendToDrive() }
                  }
                  root.addView(sendBtn)

                  check = CheckBox(this).apply {
                      text = "داخل Drive نگاه کردم و همه‌ی عکس‌ها آپلود شده‌اند"
                      isEnabled = false
                      setOnCheckedChangeListener { _, checked -> deleteBtn.isEnabled = checked }
                  }
                  root.addView(check)

                  deleteBtn = Button(this).apply {
                      text = "۳) حذف این عکس‌ها از گوشی"
                      isEnabled = false
                      setOnClickListener { deleteFromPhone() }
                  }
                  root.addView(deleteBtn)

                  val scroll = ScrollView(this)
                  scroll.addView(root)
                  setContentView(scroll)
              }

              private fun pickPhotos() {
                  val i = Intent(Intent.ACTION_OPEN_DOCUMENT).apply {
                      addCategory(Intent.CATEGORY_OPENABLE)
                      type = "image/*"
                      putExtra(Intent.EXTRA_ALLOW_MULTIPLE, true)
                  }
                  startActivityForResult(i, pickCode)
              }

              private fun sendToDrive() {
                  val i = Intent(Intent.ACTION_SEND_MULTIPLE).apply {
                      type = "image/*"
                      putParcelableArrayListExtra(Intent.EXTRA_STREAM, ArrayList(selected))
                      addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                  }
                  try {
                      i.setPackage(drivePackage)
                      startActivity(i)
                  } catch (e: Exception) {
                      i.setPackage(null)
                      startActivity(Intent.createChooser(i, "ارسال به Drive"))
                  }
                  check.isEnabled = true
              }

              private fun deleteFromPhone() {
                  try {
                      val mediaUris = selected.map { MediaStore.getMediaUri(this, it) ?: it }
                      val req = MediaStore.createDeleteRequest(contentResolver, mediaUris)
                      startIntentSenderForResult(req.intentSender, deleteCode, null, 0, 0, 0)
                  } catch (e: Exception) {
                      Toast.makeText(this, "خطا در حذف: " + e.message, Toast.LENGTH_LONG).show()
                  }
              }

              @Deprecated("Deprecated in Java")
              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == pickCode && resultCode == RESULT_OK && data != null) {
                      val list = mutableListOf<Uri>()
                      val clip = data.clipData
                      if (clip != null) {
                          for (n in 0 until clip.itemCount) list.add(clip.getItemAt(n).uri)
                      } else {
                          data.data?.let { list.add(it) }
                      }
                      selected = list
                      status.text = "${list.size} عکس انتخاب شد."
                      sendBtn.isEnabled = list.isNotEmpty()
                      check.isChecked = false
                      check.isEnabled = false
                      deleteBtn.isEnabled = false
                  }
                  if (requestCode == deleteCode) {
                      if (resultCode == RESULT_OK) {
                          status.text = "عکس‌ها از گوشی حذف شدند."
                          selected = emptyList()
                          sendBtn.isEnabled = false
                          check.isChecked = false
                          check.isEnabled = false
                          deleteBtn.isEnabled = false
                      } else {
                          status.text = "حذف لغو شد. چیزی پاک نشد."
                      }
                  }
              }
          }
          EOF

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
